"""

# The SEC modules and the helpers in sec_support call the S twins as upstream's S text
# spells them: labels at label arguments ("BEF_DECR"), ``kind`` omitted or None for the
# total, and labels in the results.  The lean S models take and return the members of
# their own stored enums module.  So a call to a lean S cell made from SEC test code (a
# frame whose module is test_*_us_sec or sec_support) passes each label at a member-typed
# parameter as that member and an omitted or None ``kind`` as ALL, and returns members
# spelled as labels (ALL as None).  The typed parameters are read from the cell's own
# formula (compared with a member, or passed on to such a parameter), and the families
# from the model's ``enums`` module, so a copied model works too.  Calls the model makes
# itself are not touched; models without an ``enums`` module (the SEC models) neither.
[[replace]]
