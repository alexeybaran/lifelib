# Test edits shared by every library: the convention test that the model folder holds
# formulas only.  A lean model with label families also holds the module stored with it
# (enums.py) and its two IOSpec files (_data/iospecs.py, _data/data.pickle), which the
# test now allows; a model without families (Term_US_S) is checked as before.
[[replace]]
files = ["delib/tests/test_model_conventions_de.py", "frlib/tests/test_model_conventions_fr.py",
         "jplib/tests/test_model_conventions_jp.py", "krlib/tests/test_model_conventions_kr.py",
         "uklib/tests/test_model_conventions_uk.py", "uslib/tests/test_model_conventions.py"]
why = "the lean models store their enums module with the model (S4 recipe)"
old = """    folder = model_path(name)
    assert not (folder / "_data").exists()
    for pattern in ("*.pickle", "*.csv", "*.xlsx", "*.xls"):
        assert not list(folder.rglob(pattern)), f"{name}: data inside the model folder"
    assert {p.name for p in folder.iterdir() if p.is_file()} == {
        "__init__.py", "_system.json"}
"""
new = """    folder = model_path(name)
    # lean conversion: the label families are a module stored with the model
    stored = {"enums.py"} if (folder / "enums.py").exists() else set()
    if stored:
        assert sorted(p.name for p in (folder / "_data").iterdir()) == [
            "data.pickle", "iospecs.py"]
    else:
        assert not (folder / "_data").exists()
    assert [p.relative_to(folder).as_posix() for p in folder.rglob("*.pickle")] == (
        ["_data/data.pickle"] if stored else [])
    for pattern in ("*.csv", "*.xlsx", "*.xls"):
        assert not list(folder.rglob(pattern)), f"{name}: data inside the model folder"
    assert {p.name for p in folder.iterdir() if p.is_file()} == {
        "__init__.py", "_system.json"} | stored
"""
