why = "SEC test code calls the lean S twins with labels"
old = """#: The members of the lean S models that stand for upstream's ``kind=None`` default.
"""
new = """# ---------------------------------------------------------------------------
# The lean S models as SEC test code calls them (lean conversion)

_SEC_CALLER = re.compile(r"^(test_\\w+_us_sec|sec_support)$")
_lean_typed_cache = {}


def _lean_families(model):
    \"\"\"The IntEnum families of a lean S model's stored ``enums`` module, or None.\"\"\"
    try:
        refs = model.refs
        mod = refs["enums"] if "enums" in refs else None
    except Exception:                   # noqa: BLE001 - not a model
        return None
    if mod is None:
        return None
    return {n: c for n, c in vars(mod).items()
            if isinstance(c, type) and issubclass(c, enum.IntEnum) and c is not enum.IntEnum}


def _lean_families_of_module(mod):
    return hasattr(mod, "__dict__") and any(
        isinstance(c, type) and issubclass(c, enum.IntEnum) and c is not enum.IntEnum
        for c in vars(mod).values())


def _lean_typed(cells, fams):
    \"\"\"{position: family} of a lean S cell's member-typed parameters, from its formula.

    Worked out for every cell of the space at once and repeated until nothing changes, so
    a cell reached in the middle of a call cycle is not left untyped.
    \"\"\"
    space = cells.parent
    # keyed by the model's own enums module, held here so that its id is not reused
    mod = space.model.refs["enums"]
    key = (id(mod), cells.name)
    if key not in _lean_typed_cache:
        for name, typed in _lean_type_space(space, fams).items():
            _lean_typed_cache[(id(mod), name)] = (mod, typed)
    return _lean_typed_cache.get(key, (mod, {}))[1]


def _lean_type_space(space, fams):
    import ast

    def member_family(node):
        if (isinstance(node, ast.Attribute) and isinstance(node.value, ast.Name)
                and node.value.id in fams):
            return node.value.id
        if isinstance(node, (ast.Tuple, ast.List)):
            found = {member_family(e) for e in node.elts}
            return found.pop() if len(found) == 1 else None
        return None

    fns = {}
    for name, cells in space.cells.items():
        try:
            fn = ast.parse(textwrap.dedent(cells.formula.source)).body[0]
            fns[name] = (fn, [a.arg for a in fn.args.args])
        except Exception:               # noqa: BLE001 - not a def: no typed parameter
            fns[name] = (None, [])
    typed = {name: {} for name in fns}
    for name, (fn, params) in fns.items():
        for node in ast.walk(fn) if fn is not None else ():
            if isinstance(node, ast.Compare):
                sides = [node.left] + node.comparators
                for a, b in zip(sides, sides[1:]):
                    for x, y in ((a, b), (b, a)):
                        if isinstance(x, ast.Name) and x.id in params and member_family(y):
                            typed[name][params.index(x.id)] = member_family(y)

    def pass_through():                 # a parameter passed on to a typed position
        changed = True
        while changed:
            changed = False
            for name, (fn, params) in fns.items():
                for node in ast.walk(fn) if fn is not None else ():
                    if not (isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
                            and node.func.id in typed):
                        continue
                    for i, a in enumerate(node.args):
                        if isinstance(a, ast.Name) and a.id in params \\
                                and params.index(a.id) not in typed[name] \\
                                and i in typed[node.func.id]:
                            typed[name][params.index(a.id)] = typed[node.func.id][i]
                            changed = True
    pass_through()
    for name, (fn, params) in fns.items():  # a label used as text, ``name.name``
        for node in ast.walk(fn) if fn is not None else ():
            if (isinstance(node, ast.Attribute) and node.attr == "name"
                    and isinstance(node.value, ast.Name) and node.value.id in params
                    and params.index(node.value.id) not in typed[name]):
                typed[name][params.index(node.value.id)] = None
    pass_through()
    return typed


def _lean_in(cells, fams, args):
    typed = _lean_typed(cells, fams)
    args = list(args)
    n = len(cells.parameters)
    for pos, name in sorted(typed.items()):
        if name is None:                # the family whose members include the label
            a = args[pos] if pos < len(args) else None
            owners = [c for c in fams.values() if isinstance(a, str) and a in c.__members__]
            if len(owners) == 1:
                args[pos] = owners[0][a]
            continue
        cls = fams[name]
        if pos >= len(args):
            if pos == len(args) and pos < n and "ALL" in cls.__members__:
                args.append(cls.ALL)    # upstream's omitted kind
            continue
        a = args[pos]
        if a is None and "ALL" in cls.__members__:
            args[pos] = cls.ALL
        elif isinstance(a, str) and a in cls.__members__:
            args[pos] = cls[a]
    return tuple(args)


def _lean_out(x):
    if isinstance(x, enum.Enum):
        return None if x.name == "ALL" else x.name
    if isinstance(x, tuple):
        return tuple(_lean_out(e) for e in x)
    if isinstance(x, list):
        return [_lean_out(e) for e in x]
    return x


def _install_lean_view():
    from modelx.core.cells import Cells
    if getattr(Cells.__call__, "_lean_view", False):
        return
    plain_call = Cells.__call__

    def __call__(self, *args, **kwargs):
        caller = sys._getframe(1).f_globals.get("__name__", "")
        if not _SEC_CALLER.match(caller.rsplit(".", 1)[-1]) or kwargs:
            return plain_call(self, *args, **kwargs)
        fams = _lean_families(self.model)
        if not fams:
            return plain_call(self, *args, **kwargs)
        return _lean_out(plain_call(self, *_lean_in(self, fams, args)))

    plain_getitem, plain_setitem = Cells.__getitem__, Cells.__setitem__

    def _key(self, key):
        fams = _lean_families(self.model)
        if not fams:
            return key
        args = key if isinstance(key, tuple) and len(self.parameters) > 1 else (key,)
        args = _lean_in(self, fams, args)
        return args if len(self.parameters) > 1 else args[0]

    def __getitem__(self, key):
        caller = sys._getframe(1).f_globals.get("__name__", "")
        if not _SEC_CALLER.match(caller.rsplit(".", 1)[-1]):
            return plain_getitem(self, key)
        return _lean_out(plain_getitem(self, _key(self, key)))

    def __setitem__(self, key, value):
        caller = sys._getframe(1).f_globals.get("__name__", "")
        if not _SEC_CALLER.match(caller.rsplit(".", 1)[-1]):
            return plain_setitem(self, key, value)
        return plain_setitem(self, _key(self, key), value)

    from modelx.core.views import RefView
    plain_items = RefView.items

    def items(self):
        caller = sys._getframe(1).f_globals.get("__name__", "")
        found = plain_items(self)
        if not _SEC_CALLER.match(caller.rsplit(".", 1)[-1]):
            return found
        # the label families a lean S model holds as References, and their stored
        # module: not upstream's
        return [(k, v) for k, v in found
                if not (isinstance(v, type) and issubclass(v, enum.IntEnum))
                and not (k == "enums" and _lean_families_of_module(v))]

    RefView.items = items

    __call__._lean_view = True
    Cells.__call__ = __call__
    Cells.__getitem__ = __getitem__
    Cells.__setitem__ = __setitem__


_install_lean_view()


#: The members of the lean S models that stand for upstream's ``kind=None`` default.
"""

