         "jplib/tests/test_model_conventions_jp.py", "krlib/tests/test_model_conventions_kr.py",
         "uklib/tests/test_model_conventions_uk.py", "uslib/tests/test_model_conventions.py"]
why = "the lean models store their enums module with the model (S4 recipe)"
