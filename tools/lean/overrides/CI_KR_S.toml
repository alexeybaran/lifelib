# CI_KR_S: overrides of the lean conversion.
#
# Ambiguity (closest to upstream): the full conversion re-spelled pols_ci_in(t, s) and
# pols_if_ci_at(t, s) -- s, an integer cohort label (t + 1 for a full claim, -(t + 1) for
# a first-year reduced one) -- as pols_ci_in(t, basis) with a new family ClaimBasis
# {FULL, REDUCED} (its step "A14").  That changes the signature and the meaning of the
# argument; upstream passes an integer, not a string label, so K1 does not apply.  The
# lean text keeps upstream's integer argument: the second parameter is untyped here.

# Convention "sequences of numbers are tuples": left as upstream's list (recorded; the
# generator does not read this key).
tuple_left = [
    "ci_cohort_ids: two tests in test_ci_insurance_kr compare the result with a list (== [-s for s ...] + list(range(...)))",
]

[params.Projection.pols_ci_in]
"1" = ""
[params.Projection.pols_if_ci_at]
"1" = ""
