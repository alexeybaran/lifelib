# VA_KR_S: overrides of the lean conversion.

# Readings the generator's general rules gave where the lean rules leave a choice
# (recorded for review; the generator does not read this key).
choices = [
    "Projection.charge_rate: line is a typed label used as a value (table key, column label or text), spelled line.name, the upstream string",
    "Projection.comm_rate: 'comm_yr%d' % y is a label computed or read as text, passed to typed Projection.charge_rate; looked up by name as ChargeLine[...] rather than re-spelled",
]

# K2: the full conversion made fund_ids() return a list (it is in the reference's
# list_cells); its test compared it with a tuple.
[[tests.replace]]
file = "test_variable_annuity_kr.py"
why = "K2: fund_ids() returns a list"
old = "    assert a.fund_ids() == (1, 2)\n"
new = "    assert a.fund_ids() == [1, 2]\n"

# The model folder now also holds the stored enums module and its two IOSpec files; this
# test walks the folder recursively.
[[tests.replace]]
file = "test_variable_annuity_kr.py"
why = "the lean model stores its enums module with the model (S4 recipe)"
old = '''    assert inside == {"__init__.py", "_system.json"}
'''
new = '''    assert inside == {"__init__.py", "_system.json", "enums.py", "iospecs.py", "data.pickle"}
'''
