# Dep_FR_S: overrides of the lean conversion.

# Readings the generator's general rules gave where the lean rules leave a choice
# (recorded for review; the generator does not read this key).
choices = [
    "Projection.carence_factor: c is a label computed or read as text, passed to typed Projection.carence_months; looked up by name as Cause[...] rather than re-spelled",
]

# Coordinator decision: an invalid label raises upstream's own error.  Upstream checks each
# cause of the cause table in carence_months (`raise ValueError("invalid cause")`); the
# lean carence_factor converts the table's text first (Cause[c]), which would raise
# KeyError.  The converting cell checks the causes first with upstream's labels and
# message, then converts.
[[replace]]
space = "Projection"
why = "upstream's ValueError ahead of the conversion"
old = """    tbl = data.cause_mix_table()                                     # noqa: F821
    return float(sum(tbl.loc[c, "share"] for c in tbl.index"""
new = """    tbl = data.cause_mix_table()                                     # noqa: F821
    for c in tbl.index:
        if c not in ("accident", "illness", "neuro"):
            raise ValueError("invalid cause")
    return float(sum(tbl.loc[c, "share"] for c in tbl.index"""

# Coordinator decision (hot cell): dep_cohorts returns tuples.  The test that wrote into
# the cell's value builds a new value instead; it still asserts the cache is unchanged.
[tuple_cells]
Projection = ["dep_cohorts"]

